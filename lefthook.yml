pre-commit:
  commands:
    biome-check:
      glob: "*.{ts,vue}"
      run: bunx @biomejs/biome check --write {staged_files} && git add {staged_files}
    eslint:
      glob: "*.{ts,vue,mjs}"
      run: bunx eslint {staged_files}
    typecheck:
      # Use the project's own typecheck script (which uses vue-tsgo, the
      # native TS 7 port) instead of `nuxi typecheck` (which calls vue-tsc
      # under the hood; vue-tsc 3.x still resolves typescript/lib/tsc, which
      # TS 7 removed from its exports field).
      run: bunx nuxi prepare && bun run scripts/typecheck.ts
    vue-sfc-size:
      glob: "*.vue"
      run: bun run scripts/check-vue-sfc-size.ts --strict {staged_files}

pre-push:
  commands:
    test-unit:
      run: bun run test:unit
    rules-drift:
      run: bun run scripts/check-rules-drift.ts
